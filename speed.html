<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏎️ 速率賽車組裝廠</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: #87CEEB; 
            overflow-x: hidden;
            touch-action: manipulation;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .animate-shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }

        /* 修改後的車子動畫：只移動車子容器 */
        @keyframes driveAway {
            0% { transform: translateX(0) scale(1); }
            15% { transform: translateX(-20px) scale(1.02); } /* 微微後退蓄力 */
            100% { transform: translateX(150vw) scale(1.02); } /* 往前衝出畫面 */
        }
        .animate-car-drive {
            animation: driveAway 2s cubic-bezier(0.5, 0, 0.8, 1) forwards;
            animation-delay: 1s; /* 灑花後等一秒才開走 */
        }

        /* 馬路虛線動畫：維持不變，產生相對速度感 */
        @keyframes roadMove {
            0% { background-position: 0px 0; }
            100% { background-position: -150px 0; } /* 讓虛線動得快一點 */
        }
        .road-moving { 
            animation: roadMove 0.15s linear infinite; 
            /* 在車子開始開走時(1秒後)才開始移動虛線 */
            animation-delay: 1s;
        }

        .card-transition { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        .wheel-spin { animation: spin 0.4s linear infinite; }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop-in { animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const generateCards = () => {
            let speeds = [];
            while(speeds.length < 3) {
                let v = Math.floor(Math.random() * 11) + 2; 
                if(!speeds.includes(v)) speeds.push(v);
            }
            speeds.sort((a, b) => a - b);

            let cards = [];
            let maxDist = 0;
            const parts = ['車尾', '車身', '車頭'];

            for(let i = 0; i < 3; i++) {
                let time = Math.floor(Math.random() * 8) + 2; 
                let distance = speeds[i] * time;
                if (distance > maxDist) maxDist = distance; 
                
                cards.push({
                    id: 'c' + i,
                    distance: distance,
                    time: time,
                    speed: speeds[i],
                    part: parts[i]
                });
            }
            return { cards, maxDist };
        };

        const shuffleArray = (array) => {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        };

        const App = () => {
            const [pool, setPool] = useState([]);
            const [slots, setSlots] = useState([null, null, null]);
            const [selectedCardId, setSelectedCardId] = useState(null);
            const [gameState, setGameState] = useState('playing'); 
            const [maxDistance, setMaxDistance] = useState(10);
            const [showSummary, setShowSummary] = useState(false);

            useEffect(() => {
                resetGame();
            }, []);

            const resetGame = () => {
                const { cards, maxDist } = generateCards();
                setMaxDistance(maxDist);
                setPool(shuffleArray(cards));
                setSlots([null, null, null]);
                setSelectedCardId(null);
                setGameState('playing');
                setShowSummary(false);
            };

            const handleCardClick = (cardId, fromSource, index) => {
                if (gameState === 'success') return;
                if (selectedCardId === null) {
                    setSelectedCardId(cardId);
                } else {
                    if (selectedCardId === cardId) {
                        setSelectedCardId(null);
                    } else {
                        moveCard(selectedCardId, { type: fromSource, index });
                        setSelectedCardId(null);
                    }
                }
            };

            const handleSlotClick = (index) => {
                if (gameState === 'success') return;
                if (selectedCardId !== null && slots[index] === null) {
                    moveCard(selectedCardId, { type: 'slot', index });
                    setSelectedCardId(null);
                }
            };

            const moveCard = (cardId, target) => {
                let source = null;
                let cardData = null;
                
                const poolIndex = pool.findIndex(c => c && c.id === cardId);
                if (poolIndex !== -1) {
                    source = { type: 'pool', index: poolIndex };
                    cardData = pool[poolIndex];
                } else {
                    const slotIndex = slots.findIndex(c => c && c.id === cardId);
                    if (slotIndex !== -1) {
                        source = { type: 'slot', index: slotIndex };
                        cardData = slots[slotIndex];
                    }
                }

                if (!cardData) return;

                let newPool = [...pool];
                let newSlots = [...slots];
                let targetCard = null;

                if (target.type === 'pool') targetCard = newPool[target.index];
                if (target.type === 'slot') targetCard = newSlots[target.index];

                if (source.type === 'pool') newPool[source.index] = targetCard;
                if (source.type === 'slot') newSlots[source.index] = targetCard;

                if (target.type === 'pool') newPool[target.index] = cardData;
                if (target.type === 'slot') newSlots[target.index] = cardData;

                setPool(newPool.filter(c => c !== null));
                setSlots(newSlots);
                if(gameState === 'error') setGameState('playing');
            };

            const checkAnswer = () => {
                if (slots.includes(null)) return;

                const isCorrect = 
                    slots[0].speed < slots[1].speed &&
                    slots[1].speed < slots[2].speed;

                if (isCorrect) {
                    setGameState('success');
                    confetti({
                        particleCount: 150,
                        spread: 100,
                        origin: { y: 0.5 },
                        colors: ['#FFD700', '#FF6347', '#4169E1', '#32CD32']
                    });
                    
                    setTimeout(() => {
                        setShowSummary(true);
                    }, 3000); // 稍微延長等待時間，確保車子開出畫面後才顯示總結
                } else {
                    setGameState('error');
                    setTimeout(() => {
                        if (gameState !== 'success') setGameState('playing');
                    }, 1000); 
                }
            };

            const ClockIcon = () => (
                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            );
            const RoadIcon = () => (
                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                </svg>
            );

            const renderCard = (card, source, index) => {
                if (!card) return null;
                const isSelected = selectedCardId === card.id;
                const isSuccess = gameState === 'success';

                const barWidth = `${(card.distance / maxDistance) * 100}%`;

                const cardBaseStyle = `card-transition relative overflow-hidden cursor-pointer select-none h-48 flex flex-col justify-center
                    ${isSelected ? 'ring-4 ring-yellow-400 transform -translate-y-2' : 'hover:-translate-y-1'}
                    ${isSuccess && source === 'slot' 
                        ? 'bg-red-500 border-none shadow-none text-white' 
                        : 'bg-white border-4 border-slate-300 shadow-[0_8px_0_rgba(0,0,0,0.1)] rounded-2xl p-4'}`;
                
                let roundedStyle = '';
                if (isSuccess && source === 'slot') {
                    if (index === 0) roundedStyle = 'rounded-l-[40px]'; 
                    if (index === 2) roundedStyle = 'rounded-r-[50px]'; 
                }

                return (
                    <div 
                        key={card.id}
                        className={`${cardBaseStyle} ${roundedStyle} w-full shadow-lg`}
                        onClick={() => handleCardClick(card.id, source, index)}
                    >
                        <div className={`transition-opacity duration-300 ${isSuccess && source === 'slot' ? 'opacity-0 hidden' : 'opacity-100 flex flex-col h-full justify-between'}`}>
                            <div>
                                <div className="flex items-center gap-2 mb-2">
                                    <RoadIcon />
                                    <span className="text-xl font-black text-gray-700">距離：{card.distance} 米</span>
                                </div>
                                <div className="w-full bg-gray-200 rounded-full h-4 mb-4 border-2 border-gray-300">
                                    <div className="bg-green-500 h-full rounded-full transition-all duration-500" style={{ width: barWidth }}></div>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-2 mt-auto pb-2 border-b-2 border-dashed border-gray-200">
                                <ClockIcon />
                                <span className="text-xl font-black text-gray-700">時間：{card.time} 秒</span>
                            </div>
                        </div>

                        {isSuccess && source === 'slot' && (
                            <div className="absolute inset-0 flex items-center justify-center">
                                {index === 1 && (
                                    <div className="absolute top-4 left-1/2 transform -translate-x-1/2 w-20 h-12 bg-sky-200 rounded-t-2xl border-4 border-red-600"></div>
                                )}
                                {index === 2 && (
                                    <div className="absolute top-10 right-4 w-6 h-6 bg-yellow-400 rounded-full shadow-[0_0_15px_rgba(255,215,0,0.8)]"></div>
                                )}
                            </div>
                        )}
                    </div>
                );
            };

            const allFilled = slots.every(s => s !== null);

            return (
                <div className="flex-grow flex flex-col items-center py-6 px-4">
                    {/* 標題區 */}
                    <div className={`text-center mb-6 bg-white/80 px-8 py-3 rounded-full shadow-md border-4 border-white backdrop-blur-sm transition-opacity duration-500 ${showSummary ? 'opacity-0' : 'opacity-100'}`}>
                        <h1 className="text-4xl font-black text-blue-700 mb-2 tracking-wide">
                            🏎️ 速率賽車組裝廠 🏁
                        </h1>
                        <p className="text-lg font-bold text-gray-600">
                            計算速率，把零件從 <span className="text-orange-500 bg-orange-100 px-2 rounded">最慢</span> 排到 <span className="text-red-500 bg-red-100 px-2 rounded">最快</span>！
                        </p>
                    </div>

                    {/* 卡片等待區 (Pool) */}
                    <div className={`w-full max-w-5xl min-h-[220px] bg-white/40 rounded-3xl p-6 border-4 border-dashed border-sky-300 mb-8 flex justify-center gap-4 flex-wrap transition-opacity duration-500 ${showSummary ? 'hidden' : 'block'}`}>
                        {pool.length === 0 && gameState !== 'success' && (
                            <div className="text-2xl font-bold text-sky-600/50 flex items-center h-full">零件都拿走囉，趕快組裝測試吧！</div>
                        )}
                        {pool.map((card, idx) => (
                            <div key={card ? card.id : `empty-pool-${idx}`} className="w-64">
                                {renderCard(card, 'pool', idx)}
                            </div>
                        ))}
                    </div>

                    {/* 總結面板 */}
                    {showSummary && (
                        <div className="absolute inset-0 flex flex-col items-center justify-center z-40 bg-white/60 backdrop-blur-sm animate-pop-in">
                            <div className="bg-white border-8 border-yellow-400 rounded-3xl p-10 max-w-3xl text-center shadow-2xl relative overflow-hidden">
                                <div className="absolute -top-10 -right-10 w-32 h-32 bg-yellow-200 rounded-full opacity-50"></div>
                                <div className="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-200 rounded-full opacity-50"></div>
                                
                                <h2 className="text-4xl font-black text-red-600 mb-8 relative z-10">🏆 挑戰成功！重點複習</h2>
                                
                                <div className="bg-blue-50 rounded-2xl p-6 mb-6 text-left border-2 border-blue-200 relative z-10">
                                    <div className="flex items-center gap-4 mb-4">
                                        <div className="bg-blue-500 text-white text-3xl w-12 h-12 flex items-center justify-center rounded-full font-bold">1</div>
                                        <h3 className="text-3xl font-bold text-blue-800">速率怎麼算？</h3>
                                    </div>
                                    <p className="text-3xl font-black text-center text-gray-700 bg-white py-4 rounded-xl shadow-sm border-2 border-dashed border-gray-300">
                                        速率 ＝ <span className="text-green-600">距離</span> ÷ <span className="text-blue-500">時間</span>
                                    </p>
                                </div>

                                <div className="bg-orange-50 rounded-2xl p-6 mb-8 text-left border-2 border-orange-200 relative z-10">
                                    <div className="flex items-center gap-4 mb-4">
                                        <div className="bg-orange-500 text-white text-3xl w-12 h-12 flex items-center justify-center rounded-full font-bold">2</div>
                                        <h3 className="text-3xl font-bold text-orange-800">如何判斷快慢？</h3>
                                    </div>
                                    <p className="text-2xl font-bold text-gray-700 leading-relaxed text-center">
                                        算出來的 <span className="text-red-500 text-3xl font-black mx-1">速率越大</span>，<br/>代表車子移動得 <span className="text-red-500 text-3xl font-black mx-1">越快！</span> 💨
                                    </p>
                                </div>

                                <button 
                                    onClick={resetGame}
                                    className="relative z-10 px-12 py-4 rounded-full text-2xl font-black bg-yellow-400 text-orange-900 shadow-[0_6px_0_#d97706] hover:bg-yellow-300 active:translate-y-2 active:shadow-none transition-all"
                                >
                                    🔄 換新題目，再玩一次！
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 下半部：包含標籤、插槽區與馬路 */}
                    <div className={`w-full max-w-6xl relative mt-auto mb-16 ${showSummary ? 'hidden' : 'block'}`}>
                        
                        <div className="flex justify-between w-full px-8 mb-4 relative z-20">
                            <div className="text-2xl font-black text-orange-600 bg-white px-6 py-2 rounded-2xl shadow-sm border-b-4 border-orange-200">🐢 最慢 (組裝車尾)</div>
                            <div className="text-2xl font-black text-red-600 bg-white px-6 py-2 rounded-2xl shadow-sm border-b-4 border-red-200">最快 (組裝車頭) 🐇</div>
                        </div>

                        {/* 修改點：將動畫 class 加在包覆卡片的內部 div 上，而不是跟馬路共用外層 */}
                        <div className={`relative z-10 max-w-5xl mx-auto`}>
                             <div className={`flex items-end justify-center w-full px-8 ${gameState === 'error' ? 'animate-shake' : ''} ${gameState === 'success' ? 'animate-car-drive gap-0' : 'gap-6'}`}>
                                {slots.map((card, idx) => (
                                    <div 
                                        key={`slot-${idx}`} 
                                        className={`card-transition relative w-1/3 h-48 ${gameState === 'success' ? '' : 'bg-black/10 border-4 border-dashed border-black/20 rounded-2xl'}`}
                                        onClick={() => handleSlotClick(idx)}
                                    >
                                        {card ? renderCard(card, 'slot', idx) : (
                                            <div className="absolute inset-0 flex items-center justify-center text-5xl font-black text-black/10">
                                                {idx + 1}
                                            </div>
                                        )}

                                        {gameState === 'success' && (idx === 0 || idx === 2) && (
                                            <div className="absolute -bottom-8 left-1/2 transform -translate-x-1/2 w-16 h-16 bg-gray-800 rounded-full border-4 border-gray-300 shadow-xl flex items-center justify-center z-20 wheel-spin">
                                                <div className="w-8 h-8 bg-gray-400 rounded-full border-2 border-gray-600 flex items-center justify-center">
                                                    <div className="w-2 h-2 bg-gray-800 rounded-full"></div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* 馬路：固定在底層，不會跟著車子位移 */}
                        <div className="absolute -bottom-6 left-[-50vw] right-[-50vw] h-12 bg-slate-700 -z-10 border-t-8 border-slate-800 overflow-hidden">
                            {/* 車子開走時(1秒後)，馬路虛線才開始向後退 */}
                            <div className={`w-full h-full ${gameState === 'success' ? 'road-moving' : ''}`} 
                                 style={{ 
                                     backgroundImage: 'linear-gradient(90deg, #fff 50%, transparent 50%)', 
                                     backgroundSize: '150px 4px', 
                                     backgroundPosition: '0px center', 
                                     backgroundRepeat: 'repeat-x' 
                                 }}>
                            </div>
                        </div>
                    </div>

                    {!showSummary && (
                        <div className="fixed bottom-8 flex gap-6 z-50">
                            {gameState === 'playing' || gameState === 'error' ? (
                                <button 
                                    onClick={checkAnswer}
                                    disabled={!allFilled}
                                    className={`px-10 py-4 rounded-full text-2xl font-black shadow-[0_8px_0_rgba(0,0,0,0.2)] transition-all ${
                                        allFilled 
                                        ? 'bg-green-500 text-white hover:bg-green-400 hover:-translate-y-1 active:translate-y-2 active:shadow-none' 
                                        : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                    }`}
                                >
                                    🚀 啟動測試！
                                </button>
                            ) : null}
                            
                            {gameState === 'error' && (
                                <div className="absolute -top-16 left-1/2 transform -translate-x-1/2 whitespace-nowrap bg-red-500 text-white px-6 py-2 rounded-xl text-xl font-bold shadow-lg animate-bounce">
                                    哎呀！順序怪怪的，有零件裝反了喔！
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
